<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenido a casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:   #12152B;
    --bg-mid:    #1B2046;
    --bg-glow:   #2B3268;
    --robot-body:#EDEBFA;
    --robot-shade:#C7C4E6;
    --robot-line:#3A3F72;
    --accent:    #FF9E6D;
    --accent-soft: rgba(255,158,109,0.35);
    --ink:       #F5F3FF;
    --ink-dim:   #A9A8CC;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background: radial-gradient(120% 140% at 18% 22%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    font-family:'Nunito Sans', sans-serif;
    color: var(--ink);
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(1.5rem, 5vw, 5rem);
    padding: clamp(1.5rem, 4vw, 4rem);
  }

  /* ambient floating particles */
  .particle{
    position:absolute;
    border-radius:50%;
    background: var(--accent-soft);
    filter: blur(1px);
    animation: drift 14s ease-in-out infinite;
    opacity:0;
  }
  @keyframes drift{
    0%   { transform: translateY(0) translateX(0); opacity:0; }
    12%  { opacity:0.55; }
    50%  { transform: translateY(-30px) translateX(10px); }
    88%  { opacity:0.3; }
    100% { transform: translateY(-70px) translateX(-6px); opacity:0; }
  }

  /* ---------- ROBOT ---------- */
  .robot-wrap{
    position:relative;
    flex: 0 0 auto;
    width: clamp(200px, 26vw, 340px);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: floaty 6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-10px); }
  }

  .robot-halo{
    position:absolute;
    width: 120%;
    height: 120%;
    border-radius:50%;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    animation: pulseHalo 3.2s ease-in-out infinite;
  }
  @keyframes pulseHalo{
    0%, 100% { opacity:0.5; transform: scale(0.94); }
    50%      { opacity:0.9; transform: scale(1.04); }
  }

  svg#robot{ position:relative; width:100%; height:auto; display:block; }

  .antenna-glow{
    animation: blinkGlow 2.6s ease-in-out infinite;
    transform-origin: 100px 26px;
  }
  @keyframes blinkGlow{
    0%, 100% { opacity:0.6; r:6; }
    50%      { opacity:1;   r:9; }
  }

  .eye{
    transform-origin: center;
    animation: blink 4.5s ease-in-out infinite;
  }
  .eye.right{ animation-delay: 0.05s; }
  @keyframes blink{
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.12); }
  }

  .mouth{
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 1.2s 0.6s ease-out forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .cheek{
    opacity:0;
    animation: appear 1s 1.1s ease-out forwards;
  }
  @keyframes appear{ to{ opacity:0.55; } }

  /* ---------- MESSAGE ---------- */
  .message{
    flex: 0 1 560px;
    opacity:0;
    transform: translateY(14px);
    animation: rise 0.9s 0.35s cubic-bezier(.22,.9,.32,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .eyebrow-line{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin-bottom:0.9rem;
    color: var(--ink-dim);
    font-size: clamp(0.85rem, 1.4vw, 1.05rem);
    font-weight:600;
  }
  .status-dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-soft);
    animation: dotPulse 2.2s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes dotPulse{
    0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
    70%  { box-shadow: 0 0 0 10px rgba(255,158,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,158,109,0); }
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    line-height:1.05;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.01em;
  }
  h1 .name{ color: var(--accent); }

  p.sub{
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    line-height:1.4;
    color: var(--ink-dim);
    margin: 0 0 1.6rem 0;
    max-width: 34ch;
  }

  .time{
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    font-weight:500;
    color: var(--ink);
    display:flex;
    align-items:baseline;
    gap:0.5rem;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 1rem;
    width: fit-content;
  }
  .time span.unit{ color: var(--ink-dim); font-size:0.8em; font-weight:400; }

  @media (max-width: 720px), (max-aspect-ratio: 4/5){
    .stage{ flex-direction:column; justify-content:center; gap:1.2rem; }
    .robot-wrap{ width: clamp(160px, 40vw, 240px); }
    .message{ text-align:center; }
    p.sub{ max-width: none; }
    .eyebrow-line{ justify-content:center; }
    .time{ margin:0 auto; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="robot-wrap">
    <div class="robot-halo"></div>
    <svg id="robot" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <!-- antenna -->
      <line x1="100" y1="40" x2="100" y2="18" stroke="var(--robot-line)" stroke-width="4" stroke-linecap="round"/>
      <circle class="antenna-glow" cx="100" cy="16" r="7" fill="var(--accent)"/>

      <!-- head -->
      <rect x="30" y="40" width="140" height="120" rx="34" fill="var(--robot-body)" stroke="var(--robot-line)" stroke-width="4"/>
      <!-- ear panels -->
      <rect x="14" y="80" width="16" height="40" rx="8" fill="var(--robot-shade)" stroke="var(--robot-line)" stroke-width="3"/>
      <rect x="170" y="80" width="16" height="40" rx="8" fill="var(--robot-shade)" stroke="var(--robot-line)" stroke-width="3"/>

      <!-- face plate -->
      <rect x="46" y="58" width="108" height="82" rx="24" fill="#161B33"/>

      <!-- eyes -->
      <g class="eye left">
        <circle cx="82" cy="98" r="11" fill="var(--accent)"/>
      </g>
      <g class="eye right">
        <circle cx="118" cy="98" r="11" fill="var(--accent)"/>
      </g>

      <!-- cheeks -->
      <circle class="cheek" cx="66" cy="116" r="6" fill="var(--accent)"/>
      <circle class="cheek" cx="134" cy="116" r="6" fill="var(--accent)"/>

      <!-- smiling mouth -->
      <path class="mouth" d="M78 122 Q100 138 122 122" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- body hint -->
      <rect x="60" y="164" width="80" height="30" rx="14" fill="var(--robot-body)" stroke="var(--robot-line)" stroke-width="4"/>
      <circle cx="100" cy="179" r="5" fill="var(--accent)"/>
    </svg>
  </div>

  <div class="message">
    <div class="eyebrow-line"><span class="status-dot"></span>Casa en línea</div>
    <h1>Hola <span class="name">Paulo</span>.<br>Bienvenido a casa.</h1>
    <p class="sub">Todo está listo para ti. Solo dime qué necesitas.</p>
    <div class="time" id="clock"><span id="clock-value">--:--</span><span class="unit" id="clock-date">cargando…</span></div>
  </div>

</div>

<script>
  // Ambient floating particles
  const stage = document.getElementById('stage');
  const NUM_PARTICLES = 10;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 8;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = 20 + Math.random() * 70 + 'vh';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.animationDuration = (10 + Math.random() * 8) + 's';
    stage.appendChild(p);
  }

  // Live clock, Spanish locale
  function updateClock(){
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('clock-value').textContent = timeStr;
    document.getElementById('clock-date').textContent = dateStr;
  }
  updateClock();
  setInterval(updateClock, 15000);
</script>

</body>
</html>
